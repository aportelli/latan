name: Release checks

on:
  workflow_call:
    inputs:
      require-release-tag:
        description: Require the Git ref to match the project version.
        required: true
        type: boolean
    outputs:
      package_version:
        description: Version read from pyproject.toml.
        value: ${{ jobs.build.outputs.package_version }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Run Ruff
        run: uv run --locked --python 3.12 ruff check .

  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"

    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Check release tag
        if: inputs.require-release-tag
        run: |
          expected_tag="v$(uv version --short)"
          test "$GITHUB_REF_NAME" = "$expected_tag" || {
            echo "tag $GITHUB_REF_NAME does not match project version $expected_tag"
            exit 1
          }

      - name: Run unit tests
        run: >-
          uv run --locked --python ${{ matrix.python-version }}
          python -m unittest discover -s tests

  build:
    name: Build and validate package
    needs: [lint, test]
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.package.outputs.version }}

    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v8.1.0

      - name: Read package version
        id: package
        run: echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"

      - name: Build distributions
        run: uv build --no-sources

      - name: Validate distribution metadata
        run: uv run --with twine twine check dist/*

      - name: Store distributions
        uses: actions/upload-artifact@v7.0.1
        with:
          name: python-package-distributions
          path: dist/
