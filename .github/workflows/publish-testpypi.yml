name: Publish to TestPyPI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testpypi-publish
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/release-checks.yml
    with:
      require-release-tag: false

  publish:
    name: Publish to TestPyPI
    needs: checks
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/latan/
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@v1.14.1
        with:
          repository-url: https://test.pypi.org/legacy/

  validate-published-package:
    name: Validate published package
    needs: [checks, publish]
    runs-on: ubuntu-latest

    steps:
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: false
          ignore-empty-workdir: true

      - name: Install and validate uploaded package
        env:
          PACKAGE_VERSION: ${{ needs.checks.outputs.package_version }}
        run: |
          for attempt in {1..10}; do
            if uv run --no-project --python 3.12 \
              --index https://test.pypi.org/simple/ \
              --default-index https://pypi.org/simple/ \
              --index-strategy unsafe-best-match \
              --with "latan==$PACKAGE_VERSION" \
              python -c 'import latan; import numpy as np; np.testing.assert_allclose(latan.eff_mass_log(np.array([1.0, 0.5, 0.25])), np.log(2.0))'; then
              exit 0
            fi
            if [ "$attempt" -eq 10 ]; then
              exit 1
            fi
            sleep 15
          done
