[project]
name = "latan"
version = "0.1.0"
description = "Statistical data analysis library for lattice field theory"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "h5py>=3.16.0",
    "matplotlib>=3.11.0",
    "numpy>=2.5.1",
    "pandas>=3.0.3",
    "scipy>=1.18.0",
]

[dependency-groups]
dev = [
    "austin-dist>=4.0.0",
    "ipykernel>=7.3.0",
    "isort>=8.0.1",
    "jupyter>=1.1.1",
    "matplotlib-inline>=0.2.2",
    "mkinit>=1.2.0",
    "tqdm>=4.68.4",
]

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "latan"
module-root = ""
